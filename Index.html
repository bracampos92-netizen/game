<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1311">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Novia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>La Novia del Monte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0a0f0d; --panel:#111916; --panel2:#151d1a; --bone:#ebe4d3; --dress:#d6d0c0; --mud:#7a6448; --lamp:#e8c27a; --danger:#c4493b; --blood:#d9584a; --muted:#9d957f; --soft:#b8af99; --rule:#27332e; --rule2:#2f3b36;
  --bg:var(--night); --ink:var(--bone);
  --display:"IM Fell English SC",Georgia,serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-size:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:var(--night); --ink:var(--bone); } }
:root[data-theme="dark"]{ --bg:var(--night); --ink:var(--bone); }
:root[data-theme="light"]{ --bg:var(--night); --ink:var(--bone); }
html,body{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IM Fell English",Georgia,serif;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100%;min-height:100dvh;display:flex;flex-direction:column;position:relative}
/* small caps label used across the UI */
.sc{font-family:var(--display);letter-spacing:.24em;font-size:13px;color:var(--muted)}

/* HUD — floats over the scene */
.hud{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:14px;padding:10px 12px 26px 18px;background:linear-gradient(180deg,rgba(0,0,0,.82),rgba(0,0,0,0));pointer-events:none}
.hud[hidden]{display:none}
.hud>*{pointer-events:auto}
.hud .chap{flex:1;font-family:var(--display);font-size:13px;letter-spacing:.2em;color:#c3baa4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--bone);font-variant-numeric:tabular-nums}
.gauge svg{width:18px;height:18px}
.batt{width:24px;height:12px;border:1.5px solid var(--bone);border-radius:3px;position:relative;padding:1.5px}
.batt::after{content:"";position:absolute;right:-4px;top:2.5px;width:2.5px;height:4px;background:var(--bone);border-radius:1px}
.batt i{display:block;height:100%;background:var(--lamp);border-radius:1px;transition:width .4s}
.batt.low i{background:var(--danger)}
.menuBtn{width:44px;height:44px;border:1px solid rgba(235,228,211,.22);border-radius:50%;background:rgba(10,15,13,.55);display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.menuBtn span{display:block;width:16px;height:1.5px;background:var(--bone);box-shadow:0 5px 0 var(--bone),0 -5px 0 var(--bone)}

/* stage */
.stageWrap{display:flex;justify-content:center;background:#000}
.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#030404;touch-action:none;user-select:none;-webkit-user-select:none}
.stage.tall{aspect-ratio:3/4;width:min(100%, calc(64vh * .75))}
.stage.hero{aspect-ratio:auto;height:min(118vw,62vh,640px)}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block;transition:filter 1s ease}
.stage.dim>svg{filter:brightness(.32)}
.stage.hero.dim>svg{filter:brightness(.55) saturate(.85)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* scene melts into the page instead of ending in a hard edge */
.stage:not(.tall)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(180deg,rgba(10,15,13,0),var(--night));pointer-events:none;z-index:2}
.stage .flash{position:absolute;inset:0;background:#f2f5f6;opacity:0;pointer-events:none;z-index:4}
.stage .vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(120,0,0,0);transition:box-shadow .8s;z-index:3}
.stage.shake{animation:shake .45s linear}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,2px)}40%,60%{transform:translate(6px,-1px)}}
.hs{fill:transparent;cursor:pointer}
.narr{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:44px 20px 16px;background:linear-gradient(transparent,rgba(0,0,0,.9));font-size:17px;line-height:1.4;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s;pointer-events:none}
.narr.on{opacity:1;transform:none}
.narr em{color:var(--lamp);font-style:italic}

/* below stage */
.panel{flex:1;display:flex;flex-direction:column;padding-bottom:24px}
.obj{padding:16px 20px 0;font-size:0;color:transparent}
.obj::before{content:"Objetivo";display:block;font-family:var(--display);font-size:12px;letter-spacing:.28em;color:var(--lamp);margin-bottom:4px}
.obj b{font-weight:400;font-size:18px;line-height:1.35;color:var(--bone)}
.nav{display:flex;gap:8px;padding:14px 20px 0;flex-wrap:wrap}
.navBtn{flex:1 1 40%;min-height:52px;background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:8px 14px;cursor:pointer;font-size:17px;text-align:left;display:flex;align-items:center;gap:10px;transition:border-color .2s,background .2s}
.navBtn::after{content:"";margin-left:auto;width:8px;height:8px;border-top:1.5px solid var(--muted);border-right:1.5px solid var(--muted);transform:rotate(45deg);flex:none}
.navBtn:hover{border-color:var(--mud)}
.navBtn:active{background:#1c2622}
.toolRow{display:flex;align-items:center;gap:14px;padding:18px 20px 0}
.torch{width:64px;height:64px;border-radius:50%;border:1px solid var(--rule2);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none;transition:background .25s,border-color .25s,box-shadow .25s}
.torch svg{width:28px;height:28px}
.torch.on{background:#3a2f1a;border-color:var(--lamp);box-shadow:0 0 24px rgba(232,194,122,.35)}
.torch+.inv{border-left:1px solid var(--rule);padding-left:14px}
.inv{display:flex;gap:8px;overflow-x:auto;flex:1;padding:2px 0;scrollbar-width:none}
.inv::-webkit-scrollbar{display:none}
.item{flex:none;width:54px;height:54px;border-radius:6px;background:var(--panel);border:1px solid var(--rule);display:grid;place-items:center;cursor:pointer;position:relative;transition:border-color .2s}
.item:hover{border-color:var(--mud)}
.item svg{width:34px;height:34px}
.item.new{border-color:var(--lamp);animation:glow 1.6s ease 2}
@keyframes glow{50%{box-shadow:0 0 16px rgba(232,194,122,.5)}}
.inv .empty{font-size:15px;color:var(--muted);font-style:italic;align-self:center}

/* story */
.text{padding:6px 24px 0}
.text p{margin:0 0 .75em;font-size:19px;line-height:1.5;opacity:0;transform:translateY(4px);transition:opacity .6s,transform .6s}
.text p.on{opacity:1;transform:none}
.text p.say{font-style:italic;color:#f1e4c4}
.text p.big{font-family:var(--display);font-size:36px;line-height:1.05;letter-spacing:.14em;color:var(--blood);margin:.15em 0 .45em}
.msg{display:inline-block;background:#203038;border-radius:14px 14px 14px 4px;padding:6px 12px;font-style:normal;font-family:system-ui,sans-serif;font-size:15px}
.choices{list-style:none;margin:10px 0 0;padding:0 24px;display:flex;flex-direction:column;gap:10px;counter-reset:ch}
.choices li{counter-increment:ch}
.choice{width:100%;min-height:58px;text-align:left;background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:10px 16px;cursor:pointer;font-size:18px;line-height:1.3;display:grid;grid-template-columns:32px minmax(0,1fr) 14px;align-items:center;opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s,border-color .2s,background .2s}
.choice::before{content:counter(ch,upper-roman);font-family:var(--display);font-size:15px;letter-spacing:.1em;color:var(--muted);transition:color .2s}
.choice::after{content:"";width:8px;height:8px;border-top:1.5px solid #5d5547;border-right:1.5px solid #5d5547;transform:rotate(45deg);justify-self:end;transition:border-color .2s}
.choice.on{opacity:1;transform:none}
.choice:hover,.choice:focus-visible,.choice:active{border-color:var(--mud);background:var(--panel2)}
.choice:hover::before,.choice:focus-visible::before{color:var(--lamp)}
.choice:hover::after,.choice:focus-visible::after{border-color:var(--lamp)}
.timer{position:relative;margin:34px 24px 6px;height:3px;background:#1d2723;display:flex;justify-content:center;overflow:visible}
.timer::before{content:"Decidí";position:absolute;left:0;bottom:11px;font-family:var(--display);font-size:13px;letter-spacing:.26em;color:var(--blood)}
.timer i{display:block;height:100%;width:100%;background:var(--danger);box-shadow:0 0 10px rgba(196,73,59,.6)}
.skip{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.5);border:1px solid var(--rule);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;z-index:3}

/* chapter card */
.card{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .9s;overflow:hidden}
.card.on{opacity:1;pointer-events:auto}
.card::before{content:attr(data-n);position:absolute;left:0;right:0;top:50%;transform:translateY(-58%);font-family:var(--display);font-size:min(78vw,360px);line-height:1;color:#0f1513;pointer-events:none}
.card small{position:relative;font-family:var(--display);font-size:15px;letter-spacing:.34em;color:var(--muted)}
.card small::after{content:"";display:block;width:180px;height:7px;margin:18px auto 0;background:linear-gradient(var(--danger),var(--danger)) center/6px 6px no-repeat,linear-gradient(#3a3226,#3a3226) left center/80px 1px no-repeat,linear-gradient(#3a3226,#3a3226) right center/80px 1px no-repeat}
.card h2{position:relative;margin:18px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(40px,13vw,64px);letter-spacing:.04em;line-height:1}
.card.on h2{animation:rise 1.4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px);letter-spacing:.12em}to{opacity:1;transform:none}}

/* sheets & overlays */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.66);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .box{width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--panel);border-top:1px solid var(--rule2);border-radius:18px 18px 0 0;padding:12px 22px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(30px);transition:transform .3s}
.sheet .box::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--rule2);margin:0 auto 16px}
.sheet.on .box{transform:none}
.sheet h3{margin:0 0 12px;font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.04em;line-height:1.1}
.sheet p{margin:0 0 .8em}
.sheet .art{border-radius:6px;overflow:hidden;margin:6px 0 12px;background:#000}
.sheet .art svg{display:block;width:100%;height:auto}
.btnRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btnRow .btn{flex:1 1 40%}
.btn{min-height:56px;padding:10px 18px;border-radius:4px;border:1px solid var(--rule2);background:transparent;cursor:pointer;font-size:19px;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--mud)}
.btn.primary{background:var(--bone);color:#15120d;border-color:var(--bone)}
.btn.primary:hover{background:#fff7e6}
.chat{background:#0e1519;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;font-family:system-ui,sans-serif;font-size:15px}
.chat .in{align-self:flex-start;background:#203038;padding:7px 12px;border-radius:14px 14px 14px 4px;max-width:85%}
.chat .out{align-self:flex-end;background:#2f4a3a;padding:7px 12px;border-radius:14px 14px 4px 14px;max-width:85%}
.chat .who{font-weight:600;color:var(--lamp);font-size:14px}
.note{background:#d9d1bd;color:#2a251c;padding:20px;border-radius:2px;transform:rotate(-1deg);font-style:italic;font-size:20px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.menu .opt{display:flex;flex-direction:column;gap:8px}
.menu .opt .btn{text-align:left}
.endings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.endings div{border:1px dashed var(--rule2);border-radius:4px;padding:14px;min-height:88px}
.endings div.got{border:1px solid var(--mud);background:var(--panel2)}
.endings b{display:block;font-weight:400;font-family:var(--display);letter-spacing:.04em;font-size:19px;line-height:1.15;margin-bottom:4px}
.endings div:not(.got) b{color:var(--muted)}
.endings span{font-size:14px;color:var(--muted)}
.clueList{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.clueList li{position:relative;padding:12px 0 12px 26px;border-bottom:1px solid var(--rule)}
.clueList li::before{content:"";position:absolute;left:4px;top:21px;width:8px;height:8px;transform:rotate(45deg);background:var(--lamp)}
.clueList li.no{color:var(--muted);font-style:italic}
.clueList li.no::before{background:none;border:1px solid #5d5547}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%) translateY(-10px);z-index:60;background:rgba(17,25,22,.94);border:1px solid var(--mud);border-radius:999px;padding:8px 18px;font-size:16px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%)}

/* title */
.titleScr{position:relative;z-index:3;margin-top:-150px;padding:0 24px 24px;display:flex;flex-direction:column}
.titleScr .top{position:absolute;top:calc(-1 * min(118vw,62vh,640px) + 150px + 22px);left:24px;right:24px;display:flex;justify-content:space-between}
.titleScr h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(52px,17vw,76px);line-height:.9;letter-spacing:.02em}
.titleScr .orn{display:flex;align-items:center;gap:12px;margin:20px 0 16px}
.titleScr .orn::before,.titleScr .orn::after{content:"";flex:1;height:1px;background:#3a3226}
.titleScr .orn i{width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--lamp)}
.titleScr p{color:var(--soft);margin:0 0 24px;font-size:17px;line-height:1.5;max-width:46ch}
.titleScr .btn{width:100%;margin-bottom:10px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px}
.titleScr .btn small{font-family:var(--display);font-size:14px;letter-spacing:.14em;color:#5b5244}
.pips{display:flex;gap:8px;align-items:center}
.pips i{width:8px;height:8px;transform:rotate(45deg);border:1px solid #5d5547}
.pips i.got{background:var(--lamp);border-color:var(--lamp)}
.titleScr .hint{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:15px;color:var(--muted);font-style:italic}
.titleScr .hint svg{flex:none}

/* ending */
.ending{padding:0 24px}
.ending .sc{color:var(--lamp);letter-spacing:.3em}
.ending h2{margin:8px 0 6px;font-family:var(--display);font-weight:400;font-size:clamp(36px,11vw,48px);line-height:1;letter-spacing:.03em}
.ending .sub{margin:0;font-size:18px;font-style:italic;color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:24px 0 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stats>div{padding:16px 0;display:flex;flex-direction:column;gap:8px}
.stats>div+div{border-left:1px solid var(--rule);padding-left:20px}
.stats .n{font-size:30px;line-height:1}
.stats .n small{font-size:18px;color:var(--muted)}
.stats .pips{height:30px}
.stats .pips i{width:10px;height:10px}
.ending .more{margin:14px 0 0;font-size:16px;color:var(--muted)}

/* hide game */
.holdWrap{display:flex;flex-direction:column;align-items:center;gap:20px;padding:22px 24px}
.hold{width:168px;height:168px;border-radius:50%;border:2px solid var(--rule2);background:radial-gradient(circle at 50% 40%,#22302b,#0e1513);display:grid;place-items:center;text-align:center;font-size:18px;line-height:1.2;padding:22px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .15s,border-color .2s,box-shadow .3s;box-shadow:0 0 0 10px rgba(235,228,211,.03)}
.hold.on{transform:scale(.95);border-color:var(--lamp);box-shadow:0 0 0 10px rgba(232,194,122,.08),0 0 40px rgba(232,194,122,.2)}
.breath{width:100%;max-width:300px}
.breath .lab{display:flex;justify-content:space-between;font-family:var(--display);font-size:13px;letter-spacing:.2em;color:var(--muted);margin-bottom:8px}
.breath .bar{height:6px;background:#1d2723;border-radius:3px;overflow:hidden}
.breath .bar i{display:block;height:100%;width:100%;background:var(--bone);transition:width .1s linear}
.hideHint{font-size:19px;font-style:italic;color:var(--soft);text-align:center;max-width:32ch;margin:0;min-height:2.6em}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
@media (prefers-reduced-motion: reduce){.text p,.choice,.card,.card.on h2,.sheet,.sheet .box,.toast,.narr{transition:none;animation:none}.stage.shake{animation:none}.item.new{animation:none}}
</style>
</head>
<body>
<noscript><div style="position:fixed;inset:0;z-index:99;background:#0a0f0d;color:#ebe4d3;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;font-size:20px;line-height:1.5">Este juego necesita abrirse en un navegador (Safari o Chrome). Si lo abriste como vista previa desde WhatsApp o Archivos, abrí el enlace del juego en el navegador.</div></noscript>
<div class="app" id="app">
  <div class="hud" id="hud" hidden>
    <div class="chap" id="chap"></div>
    <div class="gauge" title="Pulso"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.3 1.8-2.1 3.3-3.3 5.4-3.3 3.6 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z" fill="#c0473a"></path></svg><span id="bpm">72</span></div>
    <div class="gauge" title="Batería de la linterna"><div class="batt" id="batt"><i></i></div></div>
    <button class="menuBtn" id="menuBtn" aria-label="Menú"><span></span></button>
  </div>
  <div class="stageWrap"><div class="stage" id="stage"><svg id="svg" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg"></svg><canvas id="fx"></canvas><div class="vig" id="vig"></div><div class="flash" id="flash"></div><div class="narr" id="narr"></div></div></div>
  <div class="panel" id="panel"></div>
</div>
<div class="card" id="card"><small id="cardSmall"></small><h2 id="cardTitle"></h2></div>
<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>

/* ============ settings & save ============ */
const store={get(k,d){try{const v=localStorage.getItem('novia_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('novia_'+k,JSON.stringify(v))}catch(e){}}};
const settings=Object.assign({sound:true,vibe:true,fast:false},store.get('settings',{}));

/* ============ state ============ */
function fresh(){return{chapter:1,room:'sala',inv:[],clues:[],flags:{},battery:100,pulse:72,taps:0,c4taps:0,check:'c1'}}
let G=fresh();

/* ============ audio ============ */
const A={ctx:null};
function audioInit(){
  if(A.ctx){if(A.ctx.state==='suspended')A.ctx.resume();return}
  try{
    const C=A.ctx=new (window.AudioContext||window.webkitAudioContext)();
    A.master=C.createGain();A.master.gain.value=settings.sound?0.9:0;
    const comp=C.createDynamicsCompressor();A.master.connect(comp);comp.connect(C.destination);
    A.white=noise(4,false);A.brown=noise(4,true);
    // reverb: wooden-room tail for every sound effect and the music
    A.verb=C.createConvolver();A.verb.buffer=impulse(2.4,2.8);A.wet=C.createGain();A.wet.gain.value=.3;A.verb.connect(A.wet);A.wet.connect(A.master);
    A.bus=C.createGain();A.bus.connect(A.master);A.bus.connect(A.verb);
    A.music=C.createGain();A.music.gain.value=0;A.music.connect(A.master);A.music.connect(A.verb);
    // car radio: band-limited like a small speaker, with static
    A.radio=C.createGain();A.radio.gain.value=0;const rh=C.createBiquadFilter();rh.type='highpass';rh.frequency.value=320;const rl=C.createBiquadFilter();rl.type='lowpass';rl.frequency.value=3200;A.radio.connect(rh);rh.connect(rl);rl.connect(A.master);
    const st=C.createBufferSource();st.buffer=A.white;st.loop=true;const sf=C.createBiquadFilter();sf.type='bandpass';sf.frequency.value=2600;sf.Q.value=.7;A.static=C.createGain();A.static.gain.value=.025;st.connect(sf);sf.connect(A.static);A.static.connect(A.radio);st.start();
    // ambience beds
    A.rain=loopNoise(A.white,'bandpass',1800,0.5,0.0);
    A.roof=loopNoise(A.brown,'lowpass',700,1,0.0);
    A.wind=loopNoise(A.brown,'lowpass',420,1,0.0);
    const lfo=C.createOscillator(),lg=C.createGain();lfo.frequency.value=0.09;lg.gain.value=0.05;lfo.connect(lg);lg.connect(A.wind.g.gain);lfo.start();
    // engine hum
    A.engine=C.createGain();A.engine.gain.value=0;const el=C.createBiquadFilter();el.type='lowpass';el.frequency.value=170;el.connect(A.engine);A.engine.connect(A.master);
    [[46,'sawtooth',.5],[92,'square',.18],[47.3,'sawtooth',.4]].forEach(([f,ty,v])=>{const o=C.createOscillator();o.type=ty;o.frequency.value=f;const g=C.createGain();g.gain.value=v;o.connect(g);g.connect(el);o.start()});
    // drone
    A.drone=C.createGain();A.drone.gain.value=0;const dl=C.createBiquadFilter();dl.type='lowpass';dl.frequency.value=260;dl.connect(A.drone);A.drone.connect(A.master);
    [55,55.7,82.4,110.6].forEach((f,i)=>{const o=C.createOscillator();o.type=i<2?'sawtooth':'triangle';o.frequency.value=f;const g=C.createGain();g.gain.value=i<2?0.35:0.2;o.connect(g);g.connect(dl);o.start()});
    const dlfo=C.createOscillator(),dlg=C.createGain();dlfo.frequency.value=0.05;dlg.gain.value=120;dlfo.connect(dlg);dlg.connect(dl.frequency);dlfo.start();
  }catch(e){A.ctx=null}
}
function impulse(sec,decay){const C=A.ctx,len=Math.floor(C.sampleRate*sec),b=C.createBuffer(2,len,C.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}return b}
function noise(sec,brown){const C=A.ctx,b=C.createBuffer(1,C.sampleRate*sec,C.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;if(brown){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w}return b}
function loopNoise(buf,type,freq,q,vol){const C=A.ctx,s=C.createBufferSource();s.buffer=buf;s.loop=true;const f=C.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=C.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(A.master);s.start();return{f,g}}
function ramp(node,v,t=1.5){if(!A.ctx||!node)return;const n=A.ctx.currentTime;const gp=node.gain||node;gp.cancelScheduledValues(n);gp.setValueAtTime(gp.value,n);gp.linearRampToValueAtTime(v,n+t)}
function ambience({rain=0,roof=0,wind=0,drone=0}={}){if(!A.ctx)return;ramp(A.rain.g,rain);ramp(A.roof.g,roof);ramp(A.wind.g,wind);ramp(A.drone,drone,2.5)}
function burst({buf='white',dur=1,type='lowpass',freq=800,q=1,vol=.5,attack=.01,at=0,dest=null}){if(!A.ctx)return;const C=A.ctx,t=C.currentTime+Math.max(0,at),s=C.createBufferSource();s.buffer=buf==='white'?A.white:A.brown;const f=C.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=C.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);s.connect(f);f.connect(g);g.connect(dest||A.bus);s.start(t,Math.random()*2);s.stop(t+dur+.05)}
function tone({f=440,f2=null,type='sine',dur=.3,vol=.3,at=0,attack=.005,filt=null,dest=null}){if(!A.ctx)return;const C=A.ctx,t=C.currentTime+Math.max(0,at),o=C.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);const g=C.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);let n=o;if(filt){const fl=C.createBiquadFilter();fl.type=filt[0];fl.frequency.value=filt[1];fl.Q.value=filt[2]||1;o.connect(fl);n=fl}n.connect(g);g.connect(dest||A.bus);o.start(t);o.stop(t+dur+.05)}
/* plucked nylon guitar (Karplus-Strong), slightly out of tune on purpose */
const KS={};
function ksBuf(f){const k=Math.round(f*10);if(KS[k])return KS[k];const C=A.ctx,sr=C.sampleRate,len=Math.floor(sr*2.8),b=C.createBuffer(1,len,sr),d=b.getChannelData(0),N=Math.max(2,Math.round(sr/f)),r=new Float32Array(N);for(let i=0;i<N;i++)r[i]=Math.random()*2-1;let p=0;for(let i=0;i<len;i++){const nx=(p+1)%N,v=r[p];d[i]=v;r[p]=.4986*(v+r[nx]);p=nx}return KS[k]=b}
function pluck(f,{at=0,vol=.3,dest=null,detune=12}={}){if(!A.ctx)return;const C=A.ctx,t=C.currentTime+Math.max(0,at),s=C.createBufferSource();s.buffer=ksBuf(f);s.detune.value=Math.random()*detune*2-detune;const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;const g=C.createGain();g.gain.value=vol;s.connect(lp);lp.connect(g);g.connect(dest||A.bus);s.start(t);s.stop(t+2.8)}
function mbox(f,at=0,vol=.1,dest=null){tone({f,dur:1.8,vol,at,dest});tone({f:f*2.005,dur:.8,vol:vol*.35,at,dest});tone({f:f*4.02,dur:.25,vol:vol*.12,at,dest})}
const SFX={
  click(){burst({dur:.04,type:'highpass',freq:3000,vol:.15})},
  torch(){burst({dur:.05,type:'bandpass',freq:1500,q:4,vol:.35});tone({f:2400,dur:.03,vol:.06,at:.02})},
  pickup(){tone({f:880,dur:.6,vol:.12});tone({f:1320,dur:.8,vol:.08,at:.06});tone({f:1760,dur:.9,vol:.04,at:.12})},
  thunder(){burst({buf:'brown',dur:3.8,freq:260,vol:1,attack:.06});burst({dur:.25,type:'highpass',freq:900,vol:.35});burst({buf:'brown',dur:2.5,freq:120,vol:.7,attack:.3,at:.6})},
  distantThunder(){burst({buf:'brown',dur:4.5,freq:150,vol:.55,attack:.6})},
  boom(){tone({f:58,f2:30,dur:2.2,vol:1});burst({buf:'brown',dur:2.2,freq:120,vol:.8,attack:.02})},
  hit(){tone({f:150,f2:40,dur:.35,vol:1});burst({dur:.4,freq:600,vol:.8});burst({dur:.15,type:'highpass',freq:2500,vol:.3,at:.02});burst({dur:.6,type:'bandpass',freq:3200,q:3,vol:.12,at:.05})},
  brakes(){burst({dur:1.1,type:'bandpass',freq:2700,q:10,vol:.35,attack:.05});tone({f:2500,f2:1900,type:'sawtooth',dur:1,vol:.035,filt:['bandpass',2400,6]})},

  wiper(){burst({dur:.5,type:'bandpass',freq:900,q:1.3,vol:.06,attack:.22})},

  /* wooden door knock: body + knuckle + door rattle */
  knock(at=0,v=1){burst({dur:.1,type:'bandpass',freq:380,q:2.5,vol:1*v,at});tone({f:115,f2:68,dur:.18,vol:.9*v,at});burst({dur:.03,type:'highpass',freq:3000,vol:.25*v,at});burst({dur:.14,type:'bandpass',freq:1700,q:9,vol:.08*v,at:at+.02})},
  knocks(){SFX.knock(0);SFX.knock(.55);SFX.knock(1.1)},
  bang(at=0){tone({f:82,f2:44,dur:.32,vol:1,at});burst({dur:.3,freq:420,vol:.9,at});burst({dur:.2,type:'bandpass',freq:1500,q:6,vol:.12,at:at+.03})},

  plate(at=0){burst({dur:.5,type:'highpass',freq:2200,vol:.55,at});tone({f:2900,dur:.4,vol:.05,at});tone({f:4100,dur:.3,vol:.04,at:at+.01})},
  rumble(){burst({buf:'brown',dur:5,freq:140,vol:1,attack:.5});for(let i=0;i<9;i++)tone({f:70+Math.random()*30,f2:35,dur:.3,vol:.5,at:.4+i*.4+Math.random()*.2});SFX.brakes()},

const slots={};
function play(slot,name){
  const cur=slots[slot];if(cur&&cur.name===name)return;
  if(cur){clearInterval(cur.timer);delete slots[slot]}
  const bus=slot==='radio'?A.radio:A.music;
  if(!A.ctx){return}
  if(!name){ramp(bus,0,slot==='radio'?.05:1.5);return}
  const S=SONGS[name],C=A.ctx;let bar=0,next=C.currentTime+.15;
  ramp(bus,S.vol,1);
  const tick=()=>{while(next<C.currentTime+1.4){S.bar(bar,next-C.currentTime,bus);next+=S.len;bar++}};
  tick();slots[slot]={name,timer:setInterval(tick,350)};
}

  let skipped=false;const skip=()=>{skipped=true;ps.forEach(p=>p.classList.add('on'))};
  stage.onclick=skip;tx.onclick=skip;
  for(let i=0;i<ps.length;i++){if(skipped)break;ps[i].classList.add('on');await wait(step);if(tok!==storyToken)return}
  skip();stage.onclick=null;
  if(tok!==storyToken)return;
  if(s.ending){showEnding(s.ending);return}
  const list=document.createElement('ul');list.className='choices';panel.appendChild(list);
  const choices=s.dynamic?climaxChoices():s.choices;
  choices.forEach((c,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.className='choice';b.textContent=c.t;

}
function pickItem(){
  const opts=G.inv.map(id=>`<button class="item" data-i="${id}" aria-label="${ITEM[id].n}">${ICON[id]}</button>`).join('');
  sheet(`<h3>¿Qué le mostrás?</h3><p>Ella espera frente a Don Rigo. Elegí algo de lo que llevás.</p><div class="inv" style="flex-wrap:wrap">${opts||'<span class="empty">No llevás nada.</span>'}</div><div class="btnRow"><button class="btn" data-close>Mejor no</button></div>`,box=>{

  });

function showEnding(k){
  const got=new Set(store.get('endings',[]));got.add(k);store.set('endings',[...got]);store.set('save',null);
  heartbeat(0);ambience({rain:.15,drone:.03});
  const e=ENDINGS[k];
  const pp=[0,1,2,3].map(n=>`<i class="${n<got.size?'got':''}"></i>`).join('');
  const div=document.createElement('div');div.className='ending';div.innerHTML=`<span class="sc">Final ${k}</span><h2>${e[0]}</h2><p class="sub">${e[1]}</p><div class="stats"><div><span class="sc">Pistas</span><span class="n">${G.clues.length} <small>de 4</small></span></div><div><span class="sc">Finales</span><span class="pips" aria-label="${got.size} de 4 finales">${pp}</span></div></div>${G.clues.length<4?'<p class="more">Hay pistas que todavía no viste.</p>':''}`;

}

    b.onclick=()=>{if(G.battery<=0){toast('Sin batería');return}V.torch=!V.torch;sfx('torch');renderTools()};t.appendChild(b)}
  const inv=document.createElement('div');inv.className='inv';inv.id='inv';t.appendChild(inv);renderInv();
}
function renderInv(newId){const inv=$('inv');if(!inv)return;inv.innerHTML=G.inv.length?'':'<span class="empty">Inventario vacío</span>';
  for(const id of G.inv){const b=document.createElement('button');b.className='item'+(id===newId?' new':'');b.innerHTML=ICON[id];b.setAttribute('aria-label',ITEM[id].n);b.onclick=()=>{sfx('click');openItem(id)};inv.appendChild(b)}}
function openItem(id){if(id==='foto'&&G.flags.metRigo&&!clue('foto'))addClue('foto');const it=ITEM[id];sheet(`<h3>${it.n}</h3>${it.html?it.html():'<p>'+it.d+'</p>'}<div class="btnRow"><button class="btn primary" data-close>Cerrar</button></div>`)}

/* light follows finger */
stage.addEventListener('pointerdown',e=>{if(mode!=='explore')return;moveLight(e)});
stage.addEventListener('pointermove',e=>{if(mode!=='explore')return;if(e.pointerType==='mouse'||e.buttons)moveLight(e)});
function moveLight(e){const r=stage.getBoundingClientRect();V.light.x=(e.clientX-r.left)/r.width;V.light.y=(e.clientY-r.top)/r.height}

/* ---------- HIDE minigame ---------- */
const HIDESVG={
 cama:`<rect width="540" height="720" fill="#070605"></rect><rect x="0" y="0" width="540" height="150" fill="#a59c87"></rect><rect x="0" y="140" width="540" height="20" fill="#2b2118"></rect><rect x="0" y="160" width="540" height="560" fill="#0d0a08"></rect><g stroke="#151009" stroke-width="2">${Array.from({length:12},(_,i)=>`<line x1="0" y1="${200+i*45}" x2="540" y2="${200+i*45}"></line>`).join('')}</g><rect x="200" y="330" width="140" height="6" fill="#e6d7a8" opacity=".35"></rect>`,
 armario:`<rect width="540" height="720" fill="#050403"></rect><rect x="250" y="0" width="40" height="720" fill="#2a1f17"></rect><rect x="262" y="0" width="16" height="720" fill="#6b5c45" opacity=".35"></rect><g fill="#141010"><rect x="40" y="40" width="160" height="300" rx="20"></rect><rect x="330" y="40" width="160" height="320" rx="20"></rect></g>`,
 cortina:`<rect width="540" height="720" fill="#121618"></rect><path d="M0 0 L540 0 L540 720 L0 720 Z" fill="#cfcabc" opacity=".92"></path><path d="M60 0 Q70 360 55 720 M150 0 Q158 360 145 720 M250 0 Q256 360 246 720 M350 0 Q356 360 346 720 M450 0 Q455 360 448 720" stroke="#a9a493" stroke-width="5" fill="none"></path>`
};
const SHADOW=`<g id="threat" opacity="0"><path d="M-60 -10 Q-70 120 -90 240 L90 240 Q70 120 60 -10 Z" fill="#d6d0c0"></path><path d="M-90 240 L-70 220 L-55 245 L-35 222 L-15 248 L5 224 L25 246 L45 222 L65 244 L90 240 Z" fill="#cbc4b1"></path><ellipse cx="-30" cy="200" rx="18" ry="9" fill="#6e5d45" opacity=".45"></ellipse><path d="M-45 -10 Q-40 100 -48 230 M-15 -10 Q-18 110 -10 236 M20 -10 Q22 100 14 232 M48 -10 Q44 110 52 228" stroke="#080808" stroke-width="7" fill="none"></path><ellipse cx="-28" cy="252" rx="16" ry="8" fill="#b3a993"></ellipse><ellipse cx="24" cy="252" rx="16" ry="8" fill="#b3a993"></ellipse></g>`;
let hideState=null;
function startHide(spot){
  fireSound(false);mode='hide';clearTimers();checkpoint('hide');G.flags.hideSpot=spot;
  const conf={cama:{drain:13,thr:.62,tx:270,ty:330,sc:1.1},armario:{drain:14,thr:.6,tx:270,ty:300,sc:1.4},cortina:{drain:13,thr:.55,tx:270,ty:330,sc:1.6}}[spot];
  setSvg(HIDESVG[spot]+`<g transform="translate(${conf.tx},${conf.ty}) scale(${conf.sc})">${SHADOW}</g>`,true);stage.classList.remove("dim");V.dark=false;V.rain=false;
  ambience({roof:.12,wind:.03,drone:.14});
  panel.innerHTML=`<div class="holdWrap"><p class="hideHint" id="hHint">Mantené presionado para contener la respiración. Soltá para respirar cuando se aleje.</p><button class="hold" id="hold" aria-label="Contener la respiración">Contener la respiración</button><div class="breath"><div class="lab"><span>Aire</span><span id="hTime"></span></div><div class="bar"><i id="hBar"></i></div></div></div>`;
  const btn=$('hold');let holding=false;
  const down=e=>{e.preventDefault();if(!holding){holding=true;btn.classList.add('on');vibe(15)}};
  const up=e=>{if(holding){holding=false;btn.classList.remove('on');sfx('breathIn')}};
  btn.addEventListener('pointerdown',down);btn.addEventListener('contextmenu',e=>e.preventDefault());addEventListener('pointerup',up);addEventListener('pointercancel',up);
  const kd=e=>{if(e.code==='Space'){e.preventDefault();down(e)}},ku=e=>{if(e.code==='Space')up(e)};addEventListener('keydown',kd);addEventListener('keyup',ku);
  const total=26000,t0=performance.now();let air=100,grace=0,lastStep=0,lastBeat=0,forced=false,done=false;
  const curve=t=>{ // proximity over time (0..1)
    const k=[[0,0],[3,0],[6,.75],[8.5,1],[10.5,.9],[12.5,.2],[14.5,.1],[16.5,.85],[19.5,1],[21,.95],[22.5,.3],[26,0]];
    for(let i=1;i<k.length;i++)if(t<=k[i][0]){const[a,pa]=k[i-1],[b,pb]=k[i];return pa+(pb-pa)*(t-a)/(b-a)}return 0};
  const threat=svg.querySelector('#threat');
  const cleanup=()=>{done=true;removeEventListener('pointerup',up);removeEventListener('pointercancel',up);removeEventListener('keydown',kd);removeEventListener('keyup',ku);heartbeat(0)};
  hideState={cleanup};
  let last=t0;
  const loop=now=>{if(done)return;const dt=(now-last)/1000;last=now;const t=(now-t0)/1000,p=curve(t);
    threat.setAttribute('opacity',Math.min(1,p*1.3).toFixed(2));threat.setAttribute('transform',`translate(${(1-p)*-260},0)`);
    if(p>.1&&now-lastStep>Math.max(450,1100-p*700)){sfx('step');lastStep=now}
    const rate=Math.max(380,1000-p*620);if(now-lastBeat>rate){sfx('heart');lastBeat=now;if(p>.5)vibe(25)}
    if(holding&&!forced){air-=conf.drain*dt;if(air<=0){air=0;forced=true;holding=false;btn.classList.remove('on');sfx('gasp');$('hHint').textContent='¡Te quedaste sin aire!';setTimeout(()=>forced=false,900)}}
    else{air=Math.min(100,air+28*dt)}
    $('hBar').style.width=air+'%';$('hTime').textContent=Math.max(0,Math.ceil((total-(now-t0))/1000))+' s';
    const noisy=!holding;
    if(noisy&&p>conf.thr){grace+=dt;if(grace>.8){cleanup();caught();return}}else grace=Math.max(0,grace-dt*2);
    if(p>conf.thr&&!holding&&!forced)$('hHint').textContent='¡Está aquí! ¡Contené la respiración!';else if(!forced)$('hHint').textContent=p>.3?'Se acerca…':'Se aleja. Respirá ahora.';
    if(now-t0>=total){cleanup();survived();return}
    requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
}
async function caught(){mode='story';sfx('sting');vibe([400,80,400]);flash(2);shake();
  setSvg(`<rect width="540" height="720" fill="#000"></rect><g transform="translate(270,330) scale(2.6)"><path d="M-20 -6 Q-25 -46 0 -50 Q25 -46 20 -6 Q18 16 8 26 L-8 26 Q-18 16 -20 -6 Z" fill="#e4ddcc"></path><ellipse cx="-8" cy="-16" rx="7" ry="9" fill="#090909"></ellipse><ellipse cx="8" cy="-16" rx="7" ry="9" fill="#090909"></ellipse><ellipse cx="0" cy="12" rx="5" ry="7" fill="#090909"></ellipse><path d="M-26 -44 Q-36 40 -30 120 M26 -44 Q36 40 30 120 M-18 -48 Q-24 30 -20 110 M18 -48 Q24 30 20 110" stroke="#080808" stroke-width="5" fill="none"></path></g>`,true);
  panel.innerHTML='<div class="text"><p class="on big" style="font-size:30px">Te encontró.</p><p class="on" style="color:var(--muted)">Respiraste cuando estaba demasiado cerca. Fijate en los pasos y en el latido: cuando se aceleran, contené el aire.</p></div><div class="btnRow" style="padding:12px 24px 0"><button class="btn primary" id="retry">Intentar otra vez</button></div>';
  $('retry').onclick=()=>startHide(G.flags.hideSpot||'cama');}
async function survived(){mode='story';ambience({drone:.08});narr('Los pasos se alejan hacia la sala…',2600);G.pulse=110;setPulse(0);await wait(2200);startChapter(5)}

/* ---------- chapters ---------- */
async function startChapter(n){
  G.chapter=n;checkpoint('c'+n);await chapterCard(n);
  if(n===1){story('carro')}
  else if(n===2){if(!has('linterna'))give('linterna',true);G.room='sala';mode='explore';V.torch=false;ambience({roof:.22,wind:.06,drone:.02});renderRoom();narr('<em>Luis:</em> "Voy a sacar las cosas del carro. Revise la casa, amor."',4500)}
  else if(n===3){story('golpes')}
  else if(n===4){G.room='sala';G.flags.lightsOut=true;mode='explore';V.torch=false;G.c4taps=0;ambience({roof:.18,wind:.08,drone:.08});renderRoom();narr('Es de madrugada. Don Rigo duerme en el sillón. Luis, en el cuarto. La cara del viejo te recuerda a alguien. Algo te dice que no contó toda la verdad.',5200);clearTimeout(c4Timer);c4Timer=setTimeout(()=>{if(mode==='explore'&&G.chapter===4&&!G.flags.hideTriggered)triggerPasos()},110000)}
  else if(n===5){story('climax')}
}

/* ---------- sheets / menu ---------- */
function sheet(html,bind){const s=$('sheet'),b=$('sheetBox');b.innerHTML=html;s.classList.add('on');b.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeSheet);if(bind)bind(b);const f=b.querySelector('button');if(f)f.focus({preventScroll:true})}
function closeSheet(){$('sheet').classList.remove('on')}
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
function endingsHtml(){const got=new Set(store.get('endings',[]));return '<div class="endings">'+Object.entries(ENDINGS).map(([k,v])=>got.has(k)?`<div class="got"><b>${v[0]}</b><span>Final ${k}. ${v[1]}</span></div>`:`<div><b>???</b><span>Final ${k} sin descubrir</span></div>`).join('')+'</div>'}
function diaryHtml(){return '<ul class="clueList">'+Object.entries(CLUES).map(([k,v])=>clue(k)?`<li>${v}</li>`:'<li class="no">Pista sin descubrir</li>').join('')+'</ul>'}
$('menuBtn').onclick=()=>{sfx('click');sheet(`<h3>Pausa</h3><div class="menu"><div class="opt">
 <button class="btn" id="mDiary">Diario de pistas (${G.clues.length} de 4)</button>
 <button class="btn" id="mSound">Sonido: ${settings.sound?'activado':'apagado'}</button>
 <button class="btn" id="mVibe">Vibración: ${settings.vibe?'activada':'apagada'}</button>
 <button class="btn" id="mFast">Texto rápido: ${settings.fast?'sí':'no'}</button>
 <button class="btn" id="mFull">Pantalla completa</button>
 <button class="btn" id="mTitle">Salir al menú principal</button>
 <button class="btn primary" data-close>Seguir jugando</button></div></div>`,b=>{
  $('mDiary').onclick=()=>sheet('<h3>Diario de Johana</h3>'+diaryHtml()+'<div class="btnRow"><button class="btn primary" data-close>Cerrar</button></div>');
  $('mSound').onclick=()=>{settings.sound=!settings.sound;saveSettings();if(A.master)A.master.gain.value=settings.sound?.9:0;$('menuBtn').onclick()};
  $('mVibe').onclick=()=>{settings.vibe=!settings.vibe;saveSettings();vibe(40);$('menuBtn').onclick()};
  $('mFast').onclick=()=>{settings.fast=!settings.fast;saveSettings();$('menuBtn').onclick()};
  $('mFull').onclick=()=>{if(document.fullscreenElement){try{document.exitFullscreen()}catch(e){}closeSheet()}else{closeSheet();goFullscreen(true)}};
  $('mTitle').onclick=()=>{closeSheet();title()};
 })};

/* ---------- title ---------- */
function title(){
  mode='title';clearTimers();storyToken++;radio(false);car(false);fireSound(false);heartbeat(0);if(hideState)hideState.cleanup();hud(false);
  setSvg(ART.a03,false);stage.classList.add('dim','hero');svg.setAttribute('preserveAspectRatio','xMidYMid slice');V.rain=true;V.dark=false;
  const save=store.get('save',null),got=store.get('endings',[]);
  const pips=[0,1,2,3].map(n=>`<i class="${n<got.length?'got':''}"></i>`).join('');
  panel.innerHTML=`<div class="titleScr"><h1>La Novia<br>del Monte</h1><div class="orn" aria-hidden="true"><i></i></div><p>Sos Johana. Un fin de semana en una casa de montaña, un camino viejo bajo la lluvia y algo que atropellaron sin ver. Explorá la casa, encontrá las pistas y sobreviví a la madrugada.</p>
  ${save?'<button class="btn primary" id="tCont"><span>Continuar</span><small>'+CHAP[save.chapter]+'</small></button>':''}
  <button class="btn ${save?'':'primary'}" id="tNew">Nueva partida</button>
  <button class="btn" id="tEnd" aria-label="Finales: ${got.length} de 4"><span>Finales</span><span class="pips" aria-hidden="true">${pips}</span></button>
  <p class="hint"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"></path><rect x="3" y="14" width="4" height="7" rx="1.5"></rect><rect x="17" y="14" width="4" height="7" rx="1.5"></rect></svg><span>Tocá la pantalla para escuchar la música. Con audífonos y el teléfono en vertical. Activá la pantalla completa en el menú.</span></p></div>`;
  $('tNew').onclick=()=>{audioInit();newGame()};
  const unlock=()=>{audioInit();if(mode==='title'){ambience({rain:.18,wind:.06});music('title')}};
  panel.addEventListener('pointerdown',unlock,{once:true});if(A.ctx){ambience({rain:.18,wind:.06});music('title')}
  if(save)$('tCont').onclick=()=>{audioInit();G=Object.assign(fresh(),save);updBatt();setPulse(0);resume()};
  $('tEnd').onclick=()=>sheet('<h3>Finales</h3>'+endingsHtml()+'<div class="btnRow"><button class="btn primary" data-close>Cerrar</button></div>');
}
function isStandalone(){try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true}catch(e){return false}}
function fsInstructions(){const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  sheet('<h3>Jugar en pantalla completa</h3>'+(ios?'<p>En iPhone, Safari no deja que una página use la pantalla completa. Para jugar sin barras:</p><p>1. Abrí el juego en Safari.<br>2. Tocá el botón Compartir.<br>3. Elegí <b>Agregar a pantalla de inicio</b>.<br>4. Abrí el juego desde el ícono nuevo.</p>':'<p>Si la pantalla completa no se activó, instalá el juego como app:</p><p>1. Abrí el juego en Chrome.<br>2. Tocá el menú de tres puntos.<br>3. Elegí <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.<br>4. Abrí el juego desde el ícono nuevo.</p>')+'<p style="color:var(--muted)">Esto funciona cuando el juego está publicado en su propia dirección web. Dentro del visor de Claude no se puede.</p><div class="btnRow"><button class="btn primary" data-close>Entendido</button></div>')}
function goFullscreen(explain){if(isStandalone())return;const el=document.documentElement,req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!req||window.self!==window.top){if(explain)fsInstructions();return}
  try{const p=req.call(el);if(p&&p.catch)p.catch(()=>{});if(explain)setTimeout(()=>{if(!document.fullscreenElement&&!document.webkitFullscreenElement)fsInstructions()},600)}catch(e){if(explain)fsInstructions()}}
function newGame(){audioInit();G=fresh();updBatt();setPulse(0);try{if(matchMedia('(pointer:coarse)').matches&&!document.fullscreenElement)goFullscreen(false)}catch(e){}startChapter(1)}
function resume(){const c=G.check;if(c==='hide'){hud(true,CHAP[4]);startHide(G.flags.hideSpot||'cama')}else if(c==='c2b'){G.chapter=2;hud(true,CHAP[2]);mode='explore';ambience({roof:.2,wind:.08,drone:.08});renderRoom()}else startChapter(G.chapter)}

sizeFx();frame();updBatt();title();
</script>
